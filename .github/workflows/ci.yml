name: "CI"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - "*.*.*"
  pull_request:

jobs:
  docker:
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    uses: ./.github/workflows/test.yml
    if: ${{ github.event_name == 'pull_request' }}

  automerge:
    uses: ./.github/workflows/automerge.yml
    needs:
      - docker
      - test
    permissions:
      contents: write
      pull-requests: write
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

